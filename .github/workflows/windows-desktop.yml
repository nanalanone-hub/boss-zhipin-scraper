name: Windows Desktop Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version"
        required: false
        default: "0.1.0"
  push:
    branches: [master, main, "feat/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    name: Build Setup.exe and portable ZIP
    runs-on: windows-latest
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        shell: pwsh
        run: uv sync --frozen --extra desktop --extra build

      - name: Run tests
        shell: pwsh
        run: uv run python -m unittest discover -s tests -v

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows packages
        shell: pwsh
        run: uv run powershell -ExecutionPolicy Bypass -File ./scripts/build_windows.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BossCollector-windows-${{ steps.version.outputs.version }}
          path: |
            dist/artifacts/BossCollector-Setup-v*.exe
            dist/artifacts/BossCollector-portable-v*.zip
          if-no-files-found: error

      - name: Release tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/artifacts/BossCollector-Setup-v*.exe
            dist/artifacts/BossCollector-portable-v*.zip
